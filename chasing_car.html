<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Chasing Car Map</title>
  <!-- Lokale Leaflet-Dateien verwenden, wenn offline (lade von https://unpkg.com/leaflet/dist/ herunter und speichere in /leaflet/) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <!-- <link rel="stylesheet" href="leaflet/leaflet.css"/>  // Lokale Alternative -->
  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <!-- <script src="leaflet/leaflet.js"></script>  // Lokale Alternative -->
  <style>
    html, body {
      height: 100%;
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: 'Segoe UI', Arial, sans-serif;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
    }
    #map {
      width: 100vw;
      height: 100vh;
      min-height: 100vh;
      min-width: 100vw;
      border: none;
      margin: 0;
      padding: 0;
      background: #181818;
      display: block;
      position: relative;
    }
    .top-nav {
      position: absolute;
      top: 0;
      left: 0;
      z-index: 600;
      margin: 18px 0 0 30px;
      display: flex;
      gap: 18px;
    }
    .top-nav a {
      color: #ffe066;
      font-size: 1.3em;
      text-decoration: none;
      background: #333;
      padding: 6px 18px;
      border-radius: 8px;
    }
    #chaser-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      right: auto;
      top: auto;
      z-index: 1002;
      background: #222;
      color: #ffe066;
      border-radius: 8px;
      padding: 10px 18px;
      box-shadow: 0 0 8px #000;
      font-size: 1.1em;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      min-width: 300px;
      transition: transform 0.3s ease, opacity 0.3s ease; /* Animation für Ein-/Ausklappen */
    }
    #chaser-panel.collapsed {
      transform: translateY(100%); /* Ausklappen nach unten */
      opacity: 0;
    }
    #toggle-panel {
      position: absolute;
      bottom: 20px;
      left: 20px;
      z-index: 1003;
      background: #333;
      color: #ffe066;
      border: none;
      border-radius: 4px;
      padding: 4px 8px;
      cursor: pointer;
      font-size: 1.2em;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    #toggle-panel::before {
      content: '▲'; /* Pfeil nach oben für ausgeklappt */
    }
    #chaser-panel.collapsed #toggle-panel::before {
      content: '▼'; /* Pfeil nach unten für eingeklappt */
    }
    .panel-section {
      width: 100%;
      border: 1px solid #3a3a3a;
      border-radius: 8px;
      background: #1c1c1c;
      overflow: hidden;
    }
    .section-toggle {
      width: 100%;
      background: #2c2c2c;
      color: #ffe066;
      border: none;
      text-align: left;
      padding: 8px 10px;
      font-size: 1em;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .section-toggle::after {
      content: '▲';
      font-size: 0.85em;
    }
    .panel-section.collapsed .section-toggle::after {
      content: '▼';
    }
    .section-content {
      padding: 10px;
      display: block;
    }
    .panel-section.collapsed .section-content {
      display: none;
    }
    #chaser-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    #x-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    #chaser-form input {
      padding: 6px;
      border-radius: 4px;
      border: none;
      background: #333;
      color: #ffe066;
      font-size: 1em;
    }
    #chaser-form select {
      padding: 6px;
      border-radius: 4px;
      border: none;
      background: #333;
      color: #ffe066;
      font-size: 1em;
    }
    #x-form input {
      padding: 6px;
      border-radius: 4px;
      border: none;
      background: #333;
      color: #ffe066;
      font-size: 1em;
    }
    #chaser-form button {
      background: #333;
      color: #ffe066;
      border-radius: 6px;
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      font-size: 1em;
    }
    #x-form button {
      background: #333;
      color: #ffe066;
      border-radius: 6px;
      padding: 6px 12px;
      border: none;
      cursor: pointer;
      font-size: 1em;
    }
    #distance-display {
      font-weight: bold;
      font-size: 1.2em;
      color: #00bfff;
    }
    #x-distance-display {
      font-weight: bold;
      font-size: 1.2em;
      color: #00ff00;
    }
    .leaflet-control-layers {
      top: 20px !important;
      right: 20px !important;
      left: auto !important;
      bottom: auto !important;
    }
    #error-message {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: red;
      font-size: 1.5em;
      background: white;
      padding: 20px;
      border-radius: 8px;
      display: none;
    }
    /* Mobile Optimierung */
    @media (max-width: 768px) {
      .top-nav {
        display: flex; /* Zeige Navigation auf kleinen Bildschirmen */
        flex-direction: column; /* Vertikal anordnen */
        gap: 4px; /* Kleinerer Abstand */
        margin: 10px 0 0 10px; /* Kleinerer Rand */
        font-size: 1em; /* Kleinere Schrift */
      }
      .top-nav a {
        padding: 4px 8px; /* Kleinere Padding */
        font-size: 1em; /* Kleinere Schrift */
      }
      #chaser-panel {
        min-width: 250px;
        font-size: 0.9em;
        padding: 8px;
        bottom: 10px;
        left: 10px;
        right: 10px; /* Erlaube Panel über volle Breite */
        max-width: calc(100vw - 20px);
      }
      #toggle-panel {
        bottom: 10px;
        left: 10px;
      }
      #chaser-form input, #x-form input {
        font-size: 0.9em;
        padding: 4px;
      }
      #chaser-form select {
        font-size: 0.9em;
        padding: 4px;
      }
      #chaser-form button, #x-form button {
        font-size: 0.9em;
        padding: 4px 8px;
      }
      #distance-display, #x-distance-display {
        font-size: 1.1em;
      }
      .leaflet-control-layers {
        top: 10px !important;
        right: 10px !important;
      }
    }
  </style>
</head>
<body>
  <div class="top-nav">
    <a href="live.html" target="_blank">Live data</a>
    <a href="map.html" target="_blank">Map</a>
    <a href="chasing_car.html" target="_blank">Chasing Car</a>
  </div>
  <div id="map"></div>
  <button id="toggle-panel"></button>
  <div id="chaser-panel">
    <div class="panel-section" data-section="chaser">
      <button type="button" class="section-toggle">Chaser Position</button>
      <div class="section-content">
        <form id="chaser-form">
          <label for="chaser-user-id">User ID:</label>
          <select id="chaser-user-id">
            <option value="auto">auto (latest)</option>
          </select>
          <button type="button" id="refresh-users">Refresh Users</button>
          <label for="chaser-coords">Latitude,Longitude:</label>
          <input type="text" id="chaser-coords" placeholder="e.g. 48.79138,14.974624" required>
          <button type="button" id="get-gps-chaser">Get Current GPS</button>
          <button type="submit">Save Position</button>
        </form>
      </div>
    </div>
    <div class="panel-section collapsed" data-section="start-point">
      <button type="button" class="section-toggle">Start Point (X)</button>
      <div class="section-content">
        <form id="x-form">
          <label for="x-coords">Latitude,Longitude:</label>
          <input type="text" id="x-coords" placeholder="e.g. 49.077094,6.130127" required>
          <button type="submit">Save Start Point</button>
        </form>
      </div>
    </div>
    <button id="auto-zoom-btn" style="background:#333;color:#ffe066;border-radius:6px;padding:6px 12px;border:none;cursor:pointer;font-size:1em;">Auto Zoom</button>
    <div id="distance-display">Distance: -- km</div>
    <div id="x-distance-display">start distance: -- km</div>
    <div id="chaser-status" style="font-size:0.9em;color:#ffd35a;opacity:0.9;">Chaser user: auto</div>
  </div>
  <div id="error-message">Error loading map. Check console for details.</div>
  <script>
    let map, varioMarker, carMarker, connectionLine;
    let carLatLng = null;
    let xLatLng = [49.077094, 6.130127];  // Koordinaten für gelbes X
    let xMarker, xConnectionLine;
    let chaserTimestamp = null; // Timestamp for chaser position
    const CHASER_POLL_MS = 5000;
    const USER_LIST_POLL_MS = 10000;
    let activeChaserUserId = 'auto';

    try {
      const osm = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      });
      const esriSat = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}.png', {
        maxZoom: 19,
        attribution: 'Tiles © Esri'
      });
      // const topo = L.tileLayer('https://{s}.tile/opentopomap.org/{z}/{x}/{y}.png', {
      //   maxZoom: 17,
      //   attribution: '© OpenTopoMap (CC-BY-SA)'
      // });

      const baseLayers = {
        "OSM": osm,
        "Satellite": esriSat
        //"Topographic": topo
      };

      map = L.map('map', {
        center: [48.79138, 14.974624],
        zoom: 12,
        layers: [osm]
      });
      L.control.layers(baseLayers).addTo(map);
      console.log('Map initialized successfully');

      // Icon for Vario (red balloon)
      const varioIcon = L.divIcon({
        className: '',
        html: '<div style="font-size:2em;color:#ff0000;">&#x1F388;</div>', // Red balloon emoji
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      // Icon for Car
      const carIcon = L.divIcon({
        className: '',
        html: '<div style="font-size:2em;color:#00ff00;">&#x1F697;</div>', // Car emoji
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      // Icon for X
      const xIcon = L.divIcon({
        className: '',
        html: '<div style="font-size:2em;color:#ffff00;">&#x2716;</div>', // Gelbes X
        iconSize: [30, 30],
        iconAnchor: [15, 15]
      });

      function parseTextData(text) {
        const lines = text.split('\n');
        const data = {};
        lines.forEach(line => {
          let [key, value] = line.split('=');
          if (key && value !== undefined) {
            data[key.trim()] = value.trim();
          }
        });
        return {
          gps_lat: parseFloat(data.gps_lat || "0"),
          gps_lng: parseFloat(data.gps_lng || "0"),
          vario: parseFloat(data.vario || "0"),
          hoehe_ft: data.alt_ft || "",
          gps_speed: data.gps_speed || "",
          gps_course: data.gps_course || "",
          gps_time: data.gps_time || new Date().toISOString()  // Geändert zu UTC
        };
      }

      function updateConnectionLine() {
        if (varioMarker && carMarker) {
          const varioPos = varioMarker.getLatLng();
          const carPos = carMarker.getLatLng();
          if (connectionLine) {
            map.removeLayer(connectionLine);
          }
          connectionLine = L.polyline([varioPos, carPos], {color: '#ff00ff', weight: 3, opacity: 0.8}).addTo(map);
        }
      }

      function updateXConnectionLine() {
        if (varioMarker && xMarker) {
          const varioPos = varioMarker.getLatLng();
          const xPos = xMarker.getLatLng();
          if (xConnectionLine) {
            map.removeLayer(xConnectionLine);
          }
          xConnectionLine = L.polyline([varioPos, xPos], {color: '#00ff00', weight: 3, opacity: 0.8}).addTo(map);  // Grüne Linie
        }
      }

      function parseCoordinates(coordsText) {
        const parts = coordsText.split(',');
        if (parts.length !== 2) {
          return null;
        }
        const lat = parseFloat(parts[0].trim());
        const lng = parseFloat(parts[1].trim());
        if (isNaN(lat) || isNaN(lng)) {
          return null;
        }
        return { lat, lng };
      }

      function isValidLatLng(lat, lng) {
        return lat >= -90 && lat <= 90 && lng >= -180 && lng <= 180;
      }

      function sanitizeUserId(userId) {
        const sanitized = (userId || '')
          .toString()
          .trim()
          .toLowerCase()
          .replace(/^$/, 'auto')
          .replace(/[^a-z0-9_.-]/g, '_')
          .slice(0, 64);
        return sanitized || 'auto';
      }

      function setCarPosition(lat, lng, timestamp, fitToMarkers = false) {
        carLatLng = [lat, lng];
        chaserTimestamp = timestamp || new Date().toISOString();
        document.getElementById('chaser-coords').value = `${lat.toFixed(6)},${lng.toFixed(6)}`;

        if (!carMarker) {
          carMarker = L.marker(carLatLng, {icon: carIcon}).addTo(map)
            .bindPopup(`<b>Chaser Position</b><br>User: ${activeChaserUserId}<br>Lat: ${lat.toFixed(6)}<br>Lon: ${lng.toFixed(6)}<br>Timestamp: ${chaserTimestamp}`);
        } else {
          carMarker.setLatLng(carLatLng)
            .setPopupContent(`<b>Chaser Position</b><br>User: ${activeChaserUserId}<br>Lat: ${lat.toFixed(6)}<br>Lon: ${lng.toFixed(6)}<br>Timestamp: ${chaserTimestamp}`);
        }

        updateConnectionLine();

        if (fitToMarkers) {
          if (varioMarker) {
            const group = new L.featureGroup([varioMarker, carMarker]);
            map.fitBounds(group.getBounds().pad(0.1));
          } else {
            map.setView(carLatLng, 12);
          }
        }
      }

      function setChaserStatus(text) {
        const el = document.getElementById('chaser-status');
        if (el) {
          el.textContent = text;
        }
      }

      function updateUserSelect(users) {
        const select = document.getElementById('chaser-user-id');
        const previous = activeChaserUserId || select.value || 'auto';
        const normalizedUsers = Array.isArray(users) ? users.filter(Boolean) : [];

        select.innerHTML = '';
        const autoOption = document.createElement('option');
        autoOption.value = 'auto';
        autoOption.textContent = 'auto (latest)';
        select.appendChild(autoOption);

        normalizedUsers.forEach(function(userId) {
          const opt = document.createElement('option');
          opt.value = userId;
          opt.textContent = userId;
          select.appendChild(opt);
        });

        const exists = Array.from(select.options).some(function(o) {
          return o.value === previous;
        });
        activeChaserUserId = exists ? previous : 'auto';
        select.value = activeChaserUserId;
      }

      function loadChaserUsers() {
        return fetch(`get_chaser_users.php?_=${Date.now()}`, { cache: 'no-store' })
          .then(r => r.json())
          .then(data => {
            const users = data && Array.isArray(data.users) ? data.users : [];
            updateUserSelect(users);
            return users;
          })
          .catch(err => {
            console.log('Could not load chaser users:', err);
            return [];
          });
      }

      function loadSavedChaserPosition() {
        const url = `get_chaser_position.php?user_id=${encodeURIComponent(activeChaserUserId)}&_=${Date.now()}`;
        fetch(url, { cache: 'no-store' })
          .then(r => r.json())
          .then(data => {
            const lat = data && data.lat !== null ? Number(data.lat) : NaN;
            const lng = data && data.lng !== null ? Number(data.lng) : NaN;

            if (Number.isFinite(lat) && Number.isFinite(lng)) {
              const shouldFitOnFirstLoad = !carMarker;
              if (data.selected_user_id) {
                setChaserStatus(`Chaser user: auto -> ${data.selected_user_id} | ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
              } else {
                setChaserStatus(`Chaser user: ${activeChaserUserId} | ${lat.toFixed(6)}, ${lng.toFixed(6)}`);
              }
              setCarPosition(lat, lng, data.timestamp || new Date().toISOString(), shouldFitOnFirstLoad);
              return;
            }

            if (data && Array.isArray(data.available_users) && data.available_users.length > 0 && !data.available_users.includes(activeChaserUserId)) {
              activeChaserUserId = sanitizeUserId(data.available_users[0]);
              const userInput = document.getElementById('chaser-user-id');
              userInput.value = activeChaserUserId;
              localStorage.setItem('chaser_user_id', activeChaserUserId);
              setChaserStatus(`Chaser user auto-switched to: ${activeChaserUserId}`);
              loadSavedChaserPosition();
              return;
            }

            setChaserStatus(`No position for user: ${activeChaserUserId}`);
          })
          .catch(err => {
            console.log('No saved chaser position:', err);
            setChaserStatus(`Load error for user: ${activeChaserUserId}`);
          });
      }

      function setXPosition(lat, lng) {
        xLatLng = [lat, lng];

        if (!xMarker) {
          xMarker = L.marker(xLatLng, {icon: xIcon}).addTo(map)
            .bindPopup(`<b>X Position</b><br>Lat: ${lat.toFixed(6)}<br>Lon: ${lng.toFixed(6)}`);
        } else {
          xMarker.setLatLng(xLatLng)
            .setPopupContent(`<b>X Position</b><br>Lat: ${lat.toFixed(6)}<br>Lon: ${lng.toFixed(6)}`);
        }

        document.getElementById('x-coords').value = `${lat.toFixed(6)},${lng.toFixed(6)}`;

        if (varioMarker) {
          const varioPos = varioMarker.getLatLng();
          const xDistance = map.distance([varioPos.lat, varioPos.lng], xLatLng) / 1000;
          document.getElementById('x-distance-display').textContent = `X Distance: ${xDistance.toFixed(2)} km`;
        }

        updateXConnectionLine();
      }

      function updateVarioPosition(data) {
        if (!data.gps_lat || !data.gps_lng || isNaN(data.gps_lat) || isNaN(data.gps_lng)) return;

        if (!varioMarker) {
          varioMarker = L.marker([data.gps_lat, data.gps_lng], {icon: varioIcon}).addTo(map)
            .bindPopup(`<b>Vario Position</b><br>Lat: ${data.gps_lat.toFixed(6)}<br>Lon: ${data.gps_lng.toFixed(6)}<br>Alt: ${data.hoehe_ft} ft<br>Speed: ${data.gps_speed} kt<br>Track: ${data.gps_course}°<br>Vario: ${data.vario}<br>Timestamp: ${data.gps_time}`); // <-- track hinzugefügt
        } else {
          varioMarker.setLatLng([data.gps_lat, data.gps_lng])
            .setPopupContent(`<b>Vario Position</b><br>Lat: ${data.gps_lat.toFixed(6)}<br>Lon: ${data.gps_lng.toFixed(6)}<br>Alt: ${data.hoehe_ft} ft<br>Speed: ${data.gps_speed} kt<br>Track: ${data.gps_course}°<br>Vario: ${data.vario}<br>Timestamp: ${data.gps_time}`); // <-- track hinzugefügt
        }

        // Calculate distance if car position exists
        if (carLatLng) {
          const distance = map.distance([data.gps_lat, data.gps_lng], carLatLng) / 1000; // in km
          document.getElementById('distance-display').textContent = `Distance: ${distance.toFixed(2)} km`;
        }

        // Calculate distance to X
        if (xLatLng) {
          const xDistance = map.distance([data.gps_lat, data.gps_lng], xLatLng) / 1000; // in km
          document.getElementById('x-distance-display').textContent = `X Distance: ${xDistance.toFixed(2)} km`;
        }

        // Update lines
        updateConnectionLine();
        updateXConnectionLine();
      }

      function fetchAndUpdate() {
        fetch('wuzi_data.txt')
          .then(r => {
            if (!r.ok) throw new Error('wuzi_data.txt not found');
            return r.text();
          })
          .then(text => {
            const data = parseTextData(text);
            updateVarioPosition(data);
          })
          .catch(err => console.error('Error loading Vario data:', err));
      }

      setInterval(fetchAndUpdate, 30000);
      fetchAndUpdate();

      // Function to auto zoom on all markers
      function autoZoom() {
        const markers = [];
        if (varioMarker) markers.push(varioMarker);
        if (carMarker) markers.push(carMarker);
        if (xMarker) markers.push(xMarker);
        if (markers.length > 0) {
          const group = new L.featureGroup(markers);
          map.fitBounds(group.getBounds().pad(0.1));
        }
      }

      // Function to get current GPS position
      function getCurrentPosition(inputId) {
        if (navigator.geolocation) {
          navigator.geolocation.getCurrentPosition(function(position) {
            const lat = position.coords.latitude.toFixed(6);
            const lng = position.coords.longitude.toFixed(6);
            document.getElementById(inputId).value = `${lat},${lng}`;
          }, function(error) {
            alert('Error getting GPS position: ' + error.message);
          });
        } else {
          alert('Geolocation is not supported by this browser.');
        }
      }

      // Button for Chaser GPS
      document.getElementById('get-gps-chaser').addEventListener('click', function() {
        getCurrentPosition('chaser-coords');
      });

      const chaserUserIdInput = document.getElementById('chaser-user-id');
      const urlUserId = new URLSearchParams(window.location.search).get('user_id');
      const storedUserId = localStorage.getItem('chaser_user_id');
      activeChaserUserId = sanitizeUserId(urlUserId || storedUserId || chaserUserIdInput.value);
      chaserUserIdInput.value = activeChaserUserId;

      chaserUserIdInput.addEventListener('change', function() {
        activeChaserUserId = chaserUserIdInput.value === 'auto' ? 'auto' : sanitizeUserId(chaserUserIdInput.value);
        chaserUserIdInput.value = activeChaserUserId;
        localStorage.setItem('chaser_user_id', activeChaserUserId);
        setChaserStatus(`Chaser user: ${activeChaserUserId}`);
        loadSavedChaserPosition();
      });

      document.getElementById('refresh-users').addEventListener('click', function() {
        loadChaserUsers().then(function() {
          setChaserStatus(`User list updated | active: ${activeChaserUserId}`);
          loadSavedChaserPosition();
        });
      });

      // Toggle Panel
      document.getElementById('toggle-panel').addEventListener('click', function() {
        const panel = document.getElementById('chaser-panel');
        panel.classList.toggle('collapsed');
      });

      // Collapsible sections inside the panel
      document.querySelectorAll('.section-toggle').forEach(function(toggleBtn) {
        toggleBtn.addEventListener('click', function() {
          const section = toggleBtn.closest('.panel-section');
          if (section) {
            section.classList.toggle('collapsed');
          }
        });
      });

      // Form for Chaser Position
      document.getElementById('chaser-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const coords = document.getElementById('chaser-coords').value.trim();
        const parsed = parseCoordinates(coords);
        if (!parsed) {
          alert('Please enter valid latitude and longitude.');
          return;
        }
        const { lat, lng } = parsed;
        if (!isValidLatLng(lat, lng)) {
          alert('Coordinates out of range. Latitude: -90..90, Longitude: -180..180');
          return;
        }
        activeChaserUserId = chaserUserIdInput.value === 'auto' ? 'auto' : sanitizeUserId(document.getElementById('chaser-user-id').value);
        document.getElementById('chaser-user-id').value = activeChaserUserId;
        localStorage.setItem('chaser_user_id', activeChaserUserId);
        chaserTimestamp = new Date().toISOString();
        setChaserStatus(`Chaser user: ${activeChaserUserId}`);

        // Save to server (assuming save_chaser_position.php exists)
        fetch('save_chaser_position.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({user_id: activeChaserUserId, lat, lng, timestamp: chaserTimestamp})
        })
        .then(r => r.json())
        .then(msg => {
          if (msg.error) {
            throw new Error(msg.error);
          }
          alert('Position saved for user ' + activeChaserUserId + ': ' + (msg.message || 'OK'));
          // Clear the input field
          document.getElementById('chaser-coords').value = '';
        })
        .catch(err => {
          alert('Error saving position: ' + err.message);
        });

        setCarPosition(lat, lng, chaserTimestamp, true);
      });

      // Form for editable X start point
      document.getElementById('x-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const coords = document.getElementById('x-coords').value.trim();
        const parsed = parseCoordinates(coords);
        if (!parsed) {
          alert('Please enter coordinates in the format: Lat,Lon');
          return;
        }

        const { lat, lng } = parsed;
        if (!isValidLatLng(lat, lng)) {
          alert('Coordinates out of range. Latitude: -90..90, Longitude: -180..180');
          return;
        }

        fetch('save_x_position.php', {
          method: 'POST',
          headers: {'Content-Type': 'application/json'},
          body: JSON.stringify({lat, lng})
        })
        .then(r => r.json())
        .then(data => {
          if (data.error) {
            throw new Error(data.error);
          }
          setXPosition(lat, lng);
          alert('Start point saved: ' + (data.message || 'OK'));
        })
        .catch(err => {
          alert('Error saving start point: ' + err.message);
        });
      });

      // Auto Zoom Button
      document.getElementById('auto-zoom-btn').addEventListener('click', autoZoom);

      // Double-click to copy GPS position
      map.on('dblclick', function(e) {
        const lat = e.latlng.lat.toFixed(6);
        const lng = e.latlng.lng.toFixed(6);
        const coords = `${lat},${lng}`;
        navigator.clipboard.writeText(coords).then(function() {
          alert('GPS position copied: ' + coords);
        }).catch(function(err) {
          console.error('Failed to copy: ', err);
          alert('Failed to copy GPS position.');
        });
      });

      // Initialize X marker with default and then overwrite with server value if available
      setXPosition(xLatLng[0], xLatLng[1]);

      fetch('get_x_position.php')
        .then(r => r.json())
        .then(data => {
          if (data && typeof data.lat === 'number' && typeof data.lng === 'number') {
            setXPosition(data.lat, data.lng);
          }
        })
        .catch(err => console.log('No saved X position:', err));

      // Load and poll saved Chaser Position for selected user
      loadChaserUsers().then(function() {
        loadSavedChaserPosition();
      });
      setInterval(loadSavedChaserPosition, CHASER_POLL_MS);
      setInterval(loadChaserUsers, USER_LIST_POLL_MS);

      // Auto zoom after loading all data
      setTimeout(autoZoom, 500); // Small delay to ensure markers are rendered
    } catch (error) {
      console.error('Error initializing map:', error);
      document.getElementById('error-message').style.display = 'block';
    }
  </script>
</body>
</html>
