<head>
  <meta charset="UTF-8">
  <title>Wuzi Vario Welcome</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { background: #181818; color: #fff; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; overflow: hidden;}
    .container { max-width: 1200px; margin: 0 auto; position: relative; z-index: 2; }
    .links-bar {
      margin-bottom:32px;
      display:flex;
      gap:32px; /* viel größerer Abstand */
      position:relative;
      z-index:3;
      justify-content: center;
      align-items: center;
    }
    .links-bar a {
      color:#ffe066;
      font-size:2.2em; /* viel größer */
      text-decoration:none;
      background:#333;
      padding:18px 38px; /* viel größer */
      border-radius:16px;
      transition: background 0.2s, color 0.2s, transform 0.2s;
      box-shadow: 0 4px 18px #0007;
      font-weight: bold;
      letter-spacing: 1px;
    }
    .links-bar a:hover {
      background: #ffe066;
      color: #222;
      transform: scale(1.08);
    }
    .greeting {
      text-align: center;
      margin-top: 80px;
      font-size: 2.8em;
      color: #ffe066;
      font-family: 'Segoe UI', Arial, sans-serif;
      letter-spacing: 2px;
      text-shadow: 0 4px 24px #000, 0 1px 0 #fff2;
      z-index: 2;
      position: relative;
    }
    .subtitle {
      text-align: center;
      font-size: 1.5em;
      color: #fff;
      margin-top: 18px;
      margin-bottom: 60px;
      opacity: 0.85;
      z-index: 2;
      position: relative;
    }
    #balloon-area {
      position: fixed;
      left: 0; bottom: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 1;
      overflow: visible;
    }
    .svg-balloon {
      position: absolute;
      width: 90px;
      height: 160px;
      opacity: 0.93;
      will-change: transform;
      z-index: 1;
      bottom: -170px;
    }
    .svg-balloon:nth-child(1) { left: 10vw; animation: floatSvgUp 13s linear infinite; animation-delay: 0s;}
    .svg-balloon:nth-child(2) { left: 25vw; animation: floatSvgUp 14s linear infinite; animation-delay: 2s;}
    .svg-balloon:nth-child(3) { left: 40vw; animation: floatSvgUp 12s linear infinite; animation-delay: 1s;}
    .svg-balloon:nth-child(4) { left: 60vw; animation: floatSvgUp 15s linear infinite; animation-delay: 3s;}
    .svg-balloon:nth-child(5) { left: 75vw; animation: floatSvgUp 13.5s linear infinite; animation-delay: 1.5s;}
    .svg-balloon:nth-child(6) { left: 88vw; animation: floatSvgUp 14.5s linear infinite; animation-delay: 2.5s;}
    @keyframes floatSvgUp {
      0%   { transform: translateY(0) scale(1) rotate(-2deg);}
      10%  { transform: translateY(-30px) scale(1.03) rotate(2deg);}
      20%  { transform: translateY(-60px) scale(1.01) rotate(-2deg);}
      30%  { transform: translateY(-90px) scale(1.04) rotate(2deg);}
      40%  { transform: translateY(-120px) scale(1.01) rotate(-2deg);}
      50%  { transform: translateY(-150px) scale(1.05) rotate(2deg);}
      60%  { transform: translateY(-180px) scale(1.01) rotate(-2deg);}
      70%  { transform: translateY(-210px) scale(1.04) rotate(2deg);}
      80%  { transform: translateY(-240px) scale(1.01) rotate(-2deg);}
      90%  { transform: translateY(-270px) scale(1.03) rotate(2deg);}
      100% { transform: translateY(-110vh) scale(1) rotate(-2deg);}
    }
    .container, .links-bar, .greeting, .subtitle { position: relative; z-index: 2; }
    #balloon-area { z-index: 1; }
    @media (max-width: 900px) {
      .links-bar { flex-direction: column; gap: 18px; }
      .links-bar a { font-size: 1.3em; padding: 10px 18px; }
    }
    @media (max-width: 700px) {
      .greeting { font-size: 2em; }
      .subtitle { font-size: 1.1em; }
      .svg-balloon { width: 55px; height: 90px; }
    }
  </style>
</head>
